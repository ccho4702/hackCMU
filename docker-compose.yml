services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      ANALYZER: mediapipe
      TEMP_STORAGE_PATH: /tmp/mellonaires
    volumes:
      - ./backend/models:/app/models
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
